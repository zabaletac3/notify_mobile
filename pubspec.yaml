name: axonote_workspace
description: "Workspace de AxoNote móvil."
publish_to: 'none'

environment:
  sdk: ^3.13.5

workspace:
  - app
  - packages/axonote_domain
  - packages/axonote_crypto
  - packages/axonote_markdown
  - packages/axonote_api
  - packages/axonote_sync
  - packages/axonote_platform

# SQLite con SQLite3MultipleCiphers para cifrar la base local (decisión D10).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
