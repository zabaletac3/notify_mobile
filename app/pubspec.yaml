name: axonote_app
description: "Aplicación Android de AxoNote."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  axonote_api: ^0.1.0
  axonote_crypto: ^0.1.0
  axonote_domain: ^0.1.0
  axonote_platform: ^0.1.0
  axonote_sync: ^0.1.0
  connectivity_plus: ^7.3.2
  drift: ^2.35.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.2.0
  go_router: ^18.0.2
  intl: ^0.20.2
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
  assets:
    - assets/icons/
